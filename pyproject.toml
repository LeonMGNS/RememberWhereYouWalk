[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rememberwalk"
version = "1.0.0"
description = "Memory-based maze exploration for legged robots, trained with PPO in MuJoCo MJX."
authors = [{ name = "Leon Magnus" }]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.8.1",
    "flax>=0.12.1",
    "optax>=0.2.6",
    "orbax-checkpoint>=0.11.31",
    "mujoco>=3.4.0",
    "mujoco-mjx>=3.4.0",
    "numpy>=2.3",
    "scipy>=1.16",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "wandb>=0.23",
    "opencv-python",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.8.1"]
vis = [
    "pillow",
    "matplotlib",
    "glfw",
    "pyopengl",
]
experiments = [
    "matplotlib",
    "seaborn",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rememberwalk = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: compiles and runs the environment (about a minute per config)",
    "checkpoint: needs the trained checkpoints in checkpoints/",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["outputs", "scripts/outputs", "scripts/wandb", "checkpoints", "data"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import sorting, pyupgrade, bugbear
select = ["F", "E", "W", "I", "UP", "B"]
# B008: flax initializers (orthogonal(...), constant(...)) as default arguments are idiomatic and immutable
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["rememberwalk"]
